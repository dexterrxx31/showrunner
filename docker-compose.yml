services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      SHOWRUNNER_EPOCH: "2026-01-01T00:00:00+00:00"
      # Phase 2: switch the channel to the ingested DB catalog when running full.
      SHOWRUNNER_DB: ${SHOWRUNNER_DB:-}
      SHOWRUNNER_CATALOG_SOURCE: ${SHOWRUNNER_CATALOG_SOURCE:-json}
      SHOWRUNNER_BROKER: ${SHOWRUNNER_BROKER:-}

  # --- Phase 2/3 services: `docker compose --profile full up` ---------------
  worker:
    build: .
    profiles: ["full"]
    command: celery -A app.ingest.tasks.celery_app worker --loglevel=info
    volumes:
      - ./data:/app/data
    environment:
      SHOWRUNNER_DB: postgresql+psycopg://showrunner:showrunner@postgres:5432/showrunner
      SHOWRUNNER_BROKER: redis://redis:6379/0
      SHOWRUNNER_STORAGE: s3
      SHOWRUNNER_S3_ENDPOINT: http://minio:9000
      SHOWRUNNER_S3_ACCESS_KEY: showrunner
      SHOWRUNNER_S3_SECRET_KEY: showrunner
    depends_on: [postgres, redis, minio]

  postgres:
    image: postgres:16-alpine
    profiles: ["full"]
    environment:
      POSTGRES_DB: showrunner
      POSTGRES_USER: showrunner
      POSTGRES_PASSWORD: showrunner
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ["full"]

  minio:
    image: minio/minio
    profiles: ["full"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: showrunner
      MINIO_ROOT_PASSWORD: showrunner
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
